<!doctype html>
<!-- Plantilla de inserto Lottie: reproduce una animación de After Effects exportada con Bodymovin (.json) cuadro exacto.
     Poné el .json junto a este archivo (o en la misma carpeta que copies) y pasalo con --q "src=mi.json".
     Parámetros (--q): src (archivo .json), x, y (0..1, centro), ancho (px, por defecto el ancho del json), velocidad (1 = original).
     También sirve para las plantillas de After Effects que guarda la Sala (templates/<id>: bajá su json y pasalo acá). -->
<html><head><meta charset="utf-8">
<style>html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; } #a { position: absolute; }</style>
<script src="/lib/lottie.min.js"></script>
</head><body>
<div id="a"></div>
<script>
  const q = new URLSearchParams(location.search);
  const src = q.get('src') || 'animacion.json', X = +(q.get('x') || .5), Y = +(q.get('y') || .4), VEL = +(q.get('velocidad') || 1);
  const el = document.getElementById('a');
  window.ready = fetch(src).then(r => r.json()).then(data => new Promise(res => {
    const w = +(q.get('ancho') || data.w), h = w * data.h / data.w;
    Object.assign(el.style, { width: w + 'px', height: h + 'px', left: (X * 1080 - w / 2) + 'px', top: (Y * 1920 - h / 2) + 'px' });
    const anim = lottie.loadAnimation({ container: el, renderer: 'svg', loop: false, autoplay: false, animationData: data });
    anim.addEventListener('DOMLoaded', () => {
      const fr = data.fr || 30, total = (data.op - data.ip);
      window.seek = t => anim.goToAndStop(Math.min(total - 1, t * fr * VEL), true);
      res();
    });
  }));
</script>
</body></html>
